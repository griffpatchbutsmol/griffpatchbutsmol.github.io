<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Selection Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Selection Sidebar Layout */
        #sidebar {
            width: 320px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 1.1rem;
            color: #58a6ff;
            font-weight: 600;
        }
        .repo-subtitle {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .file-list {
            list-style: none;
            flex-grow: 1;
            overflow-y: auto;
        }
        .file-item {
            padding: 12px;
            margin-bottom: 8px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-item:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
        .file-item.active {
            background-color: #1f6feb;
            border-color: #58a6ff;
            color: #ffffff;
            font-weight: 600;
        }
        /* Fullscreen Expansion Controller */
        #fullscreen-btn {
            margin-top: 15px;
            padding: 12px;
            background-color: #238636;
            color: #fff;
            border: 1px solid rgba(240,246,252,0.1);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        #fullscreen-btn:hover:not(:disabled) {
            background-color: #2ea043;
        }
        #fullscreen-btn:disabled {
            background-color: #21262d;
            color: #484f58;
            cursor: not-allowed;
            border-color: #30363d;
        }
        /* Main Application Presentation Area */
        #viewer-container {
            flex-grow: 1;
            position: relative;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #fff; 
        }
        .status-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8b949e;
            font-size: 1.1rem;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Selection Screen Sidebar -->
    <div id="sidebar">
        <h2>Available Pages</h2>
        <div class="repo-subtitle" id="repoIdent">Detecting repository layout...</div>
        <ul class="file-list" id="fileList"></ul>
        <button id="fullscreen-btn" disabled>Go Fullscreen</button>
    </div>

    <!-- Presentation Area -->
    <div id="viewer-container">
        <div class="status-message" id="statusText">Analyzing deployment configurations...</div>
        <iframe id="contentViewer" style="display: none;"></iframe>
    </div>

    <script>
        const fileListEl = document.getElementById('fileList');
        const iframe = document.getElementById('contentViewer');
        const statusText = document.getElementById('statusText');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const viewerContainer = document.getElementById('viewer-container');
        const repoIdent = document.getElementById('repoIdent');

        // ==========================================
        // AUTOMATED REPOSITORY LOOKUP LOGIC
        // ==========================================
        function initializeDashboard() {
            const hostname = window.location.hostname;
            const pathname = window.location.pathname;

            // Handle fallback parsing if running locally or using a custom root domain
            let username = "";
            let repoName = "";

            if (hostname.endsWith('.github.io')) {
                // Standard GitHub Pages layout: username.github.io/repo-name/
                username = hostname.split('.')[0];
                repoName = pathname.split('/').filter(Boolean)[0] || "";
            }

            // Fallback checking to ensure the page doesn't crash if configuration parsing skips
            if (!username || !repoName) {
                repoIdent.textContent = "Running Outside GitHub Pages Environment";
                statusText.innerHTML = "To auto-scan your code, deploy this file to a live <b>GitHub Pages</b> branch.<br><br>Otherwise, open your browser Console to debug local paths manually.";
                return;
            }

            repoIdent.textContent = `${username} / ${repoName}`;
            scanRepository(username, repoName);
        }

        // ==========================================
        // CALL THE GITHUB REST API DYNAMICALLY
        // ==========================================
        function scanRepository(username, repo) {
            const BRANCH = "main"; // Change this configuration to "master" if your default branch relies on it
            const apiUrl = `https://github.com{username}/${repo}/git/trees/${BRANCH}?recursive=1`;

            statusText.textContent = "Scanning source code for alternate HTML components...";

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error("API resolution failure.");
                    return response.json();
                })
                .then(data => {
                    // Collect everything ending with .html while excluding index.html natively
                    const htmlFiles = data.tree
                        .filter(file => 
                            file.type === "blob" && 
                            file.path.endsWith('.html') && 
                            file.path.toLowerCase() !== 'index.html'
                        )
                        .map(file => file.path);

                    if (htmlFiles.length === 0) {
                        statusText.textContent = "No separate application HTML files found in this repository tree.";
                        return;
                    }

                    statusText.textContent = "Please select an asset from the menu panel";
                    buildMenu(htmlFiles);
                })
                .catch(err => {
                    console.error(err);
                    statusText.textContent = "Unable to fetch code layout. Double check if this repository configuration profile matches your default Git branch naming rules.";
                });
        }

        // ==========================================
        // UI BINDING & FILE INTERACTION LOGIC
        // ==========================================
        function buildMenu(files) {
            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                
                // Form clean presentation names safely out of messy pathways ("sub/my-test-case.html" -> "My Test Case")
                const fileName = file.split('/').pop();
                const cleanName = decodeURIComponent(fileName)
                    .replace('.html', '')
                    .replace(/[-_]/g, ' ');
                
                li.textContent = cleanName;
                li.style.textTransform = "capitalize";
                li.title = file; // Hover tooltip shows complete file system pathway
                
                li.onclick = () => renderFrameContent(file, li);
                fileListEl.appendChild(li);
            });
        }

        function renderFrameContent(relativePath, electedItem) {
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            electedItem.classList.add('active');

            statusText.style.display = 'none';
            iframe.style.display = 'block';
            
            // Set frame target pointing cleanly to relative site tree asset
            iframe.src = relativePath;
            fullscreenBtn.disabled = false;
        }

        // ==========================================
        // NATIVE HIGH-PERFORMANCE FULLSCREEN API
        // ==========================================
        fullscreenBtn.addEventListener('click', () => {
            if (viewerContainer.requestFullscreen) {
                viewerContainer.requestFullscreen();
            } else if (viewerContainer.webkitRequestFullscreen) { /* Safari & iOS App Layouts */
                viewerContainer.webkitRequestFullscreen();
            } else if (viewerContainer.msRequestFullscreen) { /* Legacy Engine Fallbacks */
                viewerContainer.msRequestFullscreen();
            }
        });

        // Fire on boot
        initializeDashboard();
    </script>
</body>
</html>
