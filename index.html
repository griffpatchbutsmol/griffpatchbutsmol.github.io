<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noahs Tutoring Hub</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
    }

    #password-gate {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(255, 122, 26, 0.14), transparent 42%),
        radial-gradient(ellipse at 85% 85%, rgba(255, 165, 0, 0.1), transparent 40%),
        #090909;
      color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #password-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(360px, 100%);
      padding: 36px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 145, 0, 0.3);
      border-radius: 20px;
      background: rgba(18, 18, 18, 0.94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), 0 0 28px rgba(255, 122, 26, 0.08);
      backdrop-filter: blur(14px);
    }

    #password-form label {
      margin-bottom: 4px;
      font-size: 1.2rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    #password-form input,
    #password-form button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 15px;
      border-radius: 10px;
      font: inherit;
    }

    #password-form input {
      border: 1px solid rgba(255, 145, 0, 0.55);
      outline: none;
      background: #111;
      color: #fff;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    #password-form input::placeholder {
      color: #a66a2c;
    }

    #password-form input:focus {
      border-color: #ff9100;
      box-shadow: 0 0 0 3px rgba(255, 145, 0, 0.18), 0 0 16px rgba(255, 145, 0, 0.12);
    }

    #password-form button {
      border: 1px solid #ff9100;
      background: linear-gradient(135deg, #c65300, #ff9100);
      color: white;
      font-weight: 650;
      cursor: pointer;
      transition: filter 160ms ease, transform 160ms ease;
    }

    #password-form button:hover {
      filter: brightness(1.12);
    }

    #password-form button:active {
      transform: translateY(1px);
    }

    #password-form button:focus-visible {
      outline: 3px solid #FF7A1A;
      outline-offset: 3px;
    }

    #password-error {
      min-height: 1.2em;
      color: #ff9b2f;
      font-size: 0.9rem;
    }

    @media (max-width: 420px) {
      #password-form {
        padding: 28px 22px;
      }
    }

    #content[hidden],
    #password-gate[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main id="password-gate">
    <form id="password-form">
      <label for="password">Enter the password to continue</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Unlock</button>
      <div id="password-error" role="alert" aria-live="polite"></div>
    </form>
  </main>

  <div id="content" hidden>
    <iframe src="https://www.qgpb2vv4e7volks7.3351dcb3.nip.io/" title="Full-screen content"></iframe>
  </div>

  <script>
    const PASSWORD = "ReallyLongPassword";
    const passwordGate = document.getElementById("password-gate");
    const content = document.getElementById("content");
    const passwordForm = document.getElementById("password-form");
    const passwordInput = document.getElementById("password");
    const passwordError = document.getElementById("password-error");
    const unlockKey = "fullscreen-content-unlocked";

    if (localStorage.getItem(unlockKey) === "true") {
      passwordGate.hidden = true;
      content.hidden = false;
    }

    passwordForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (passwordInput.value === PASSWORD) {
        localStorage.setItem(unlockKey, "true");
        passwordGate.hidden = true;
        content.hidden = false;
      } else {
        passwordError.textContent = "Incorrect password. Please try again.";
        passwordInput.select();
      }
    });
  </script>
</body>
</html>
